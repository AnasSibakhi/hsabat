<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فحص الدين</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Cairo,sans-serif;background:#0f172a;color:#e2e8f0;padding:1rem;font-size:13px;}
h2{color:#818cf8;margin-bottom:1rem;}
.log{font-family:monospace;padding:4px 8px;margin:2px 0;border-radius:4px;}
.ok{color:#34d399;background:#064e3b22;}
.err{color:#f87171;background:#7f1d1d22;}
.warn{color:#fbbf24;background:#78350f22;}
button{background:#6366f1;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-family:Cairo,sans-serif;cursor:pointer;margin:4px;font-size:14px;}
#out{margin-top:1rem;}
</style>
</head>
<body>
<h2>🔍 فحص مشكلة الدين</h2>
<p style="color:#94a3b8;margin-bottom:1rem;font-size:12px;">افتح هذه الصفحة، ثم افتح الموقع في تاب ثاني واكتب في حقل الاسم واختر زبون، ثم ارجع هنا واضغط "فحص الآن"</p>

<button onclick="check()">🔍 فحص الآن</button>
<button onclick="document.getElementById('out').innerHTML=''">مسح</button>

<div id="out"></div>

<script>
function log(msg, type='ok') {
  document.getElementById('out').innerHTML +=
    `<div class="log ${type}">${msg}</div>`;
}

function check() {
  document.getElementById('out').innerHTML = '';

  // Try to find the main app window
  const frames = Array.from(window.frames || []);
  log(`عدد الـ frames: ${frames.length}`, 'warn');

  // Check localStorage
  log('--- localStorage ---', 'warn');
  log(`notif_read_today: ${localStorage.getItem('notif_read_today') ? 'موجود' : 'فارغ'}`);

  // Instructions
  log('--- خطوات الفحص اليدوي ---', 'warn');
  log('١. افتح الموقع: hsabat-seven.vercel.app');
  log('٢. افتح البيع السريع وأضف منتج للسلة');
  log('٣. اضغط "إتمام البيع"');
  log('٤. اضغط "دين"');
  log('٥. اكتب اسم زبون في الحقل');
  log('٦. هل تظهر قائمة؟ اضغط عليها');
  log('٧. قبل ما تضغط "تأكيد" — افتح Console (F12)');
  log('٨. اكتب في Console:', 'warn');
  log('   document.getElementById("qs-debt-search").value', 'warn');
  log('   document.getElementById("qs-debt-cust").value', 'warn');
  log('٩. أرسلي النتيجتين', 'warn');
}
</script>
</body>
</html>
