<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فحص Layout</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:Cairo,sans-serif;background:#0f172a;color:#e2e8f0;padding:1rem;}
  h2{color:#818cf8;margin-bottom:1rem;font-size:16px;}
  .box{background:#1e293b;border-radius:10px;padding:12px;margin-bottom:10px;font-size:12px;}
  .label{color:#94a3b8;margin-bottom:4px;font-size:11px;}
  .val{color:#f1f5f9;font-weight:700;font-size:13px;font-family:monospace;}
  .ok{color:#34d399;} .warn{color:#fbbf24;} .err{color:#f87171;}
  .row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #334155;}
  .row:last-child{border:none;}
  button{background:#6366f1;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-family:Cairo,sans-serif;font-size:13px;cursor:pointer;margin-bottom:10px;}
  .vis-box{position:relative;border:2px dashed;border-radius:6px;margin-bottom:6px;padding:4px 8px;font-size:10px;font-weight:700;}
</style>
</head>
<body>
<h2>🔍 أداة فحص Layout — حسابات</h2>
<button onclick="runCheck()">▶ تشغيل الفحص</button>
<div id="out"></div>

<script>
function runCheck() {
  const out = document.getElementById('out');
  out.innerHTML = '';

  // Open the main app in iframe
  const iframe = document.createElement('iframe');
  iframe.src = '/';
  iframe.style.cssText = 'width:375px;height:667px;border:2px solid #6366f1;border-radius:10px;display:block;margin-bottom:1rem;';
  out.appendChild(iframe);

  iframe.onload = () => {
    try {
      const doc = iframe.contentDocument;
      const win = iframe.contentWindow;

      const results = [];

      // 1. Check layout chain
      const chain = ['html','body','#app-wrap','.app-body','.content'];
      chain.forEach(sel => {
        const el = doc.querySelector(sel);
        if (!el) { results.push({label: sel, val: 'NOT FOUND', status: 'err'}); return; }
        const s = win.getComputedStyle(el);
        const r = el.getBoundingClientRect();
        results.push({
          label: sel,
          val: `w:${Math.round(r.width)} h:${Math.round(r.height)} | overflow-y:${s.overflowY} overflow-x:${s.overflowX} | display:${s.display}`,
          status: r.width > 0 && r.height > 0 ? 'ok' : 'err'
        });
      });

      // 2. Check current page
      const activePage = doc.querySelector('.page.active');
      if (activePage) {
        const r = activePage.getBoundingClientRect();
        const s = win.getComputedStyle(activePage);
        results.push({
          label: '.page.active #' + activePage.id,
          val: `w:${Math.round(r.width)} h:${Math.round(r.height)} | top:${Math.round(r.top)}`,
          status: r.width >= 300 ? 'ok' : 'warn'
        });
      }

      // 3. Check for horizontal overflow
      const allEls = doc.querySelectorAll('.page.active *');
      let overflowEls = [];
      const contentEl = doc.querySelector('.content');
      const contentW = contentEl ? contentEl.getBoundingClientRect().width : win.innerWidth;
      allEls.forEach(el => {
        const r = el.getBoundingClientRect();
        if (r.right > contentW + 5) {
          overflowEls.push(el.tagName + (el.id?'#'+el.id:'') + (el.className?' .'+el.className.split(' ')[0]:''));
        }
      });
      results.push({
        label: 'عناصر تتجاوز العرض',
        val: overflowEls.length === 0 ? 'لا يوجد ✅' : overflowEls.slice(0,5).join(', '),
        status: overflowEls.length === 0 ? 'ok' : 'err'
      });

      // 4. Check content scrollable
      if (contentEl) {
        const scrollable = contentEl.scrollHeight > contentEl.clientHeight;
        results.push({
          label: '.content scrollHeight vs clientHeight',
          val: `scrollH:${contentEl.scrollHeight} clientH:${contentEl.clientHeight} → ${scrollable ? 'يمكن السكرول ✅' : 'لا يحتاج سكرول'}`,
          status: 'ok'
        });
      }

      // 5. Check viewport width
      results.push({
        label: 'Viewport width',
        val: `${win.innerWidth}px`,
        status: win.innerWidth > 0 ? 'ok' : 'err'
      });

      // 6. Check padding asymmetry
      if (contentEl) {
        const s = win.getComputedStyle(contentEl);
        results.push({
          label: 'Content padding',
          val: `top:${s.paddingTop} right:${s.paddingRight} bottom:${s.paddingBottom} left:${s.paddingLeft}`,
          status: s.paddingRight === s.paddingLeft ? 'ok' : 'warn'
        });
      }

      // Render
      const box = document.createElement('div');
      box.className = 'box';
      box.innerHTML = '<h2>نتائج الفحص</h2>' + results.map(r =>
        `<div class="row"><span class="label">${r.label}</span><span class="val ${r.status}">${r.val}</span></div>`
      ).join('');
      out.appendChild(box);

    } catch(e) {
      out.innerHTML += `<div class="box err">خطأ: ${e.message}</div>`;
    }
  };
}
</script>
</body>
</html>
